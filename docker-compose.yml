services:
  # 1. Message Broker
  kafka:
    image: apache/kafka:3.7.2
    container_name: metrics-kafka
    ports:
      - "9094:9094"
    environment:
      - CLUSTER_ID=5L6g3nShT-eMCtK--X86sw
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@metrics-kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://metrics-kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_HEAP_OPTS=-Xms256m -Xmx256m
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - pipeline-net

  # 2. Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: metrics-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=metrics_db
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - pipeline-net

  # 3. Distributed Cache
  redis:
    image: redis:7-alpine
    container_name: metrics-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - pipeline-net

  # 4. Search Engine
  elasticsearch:
    container_name: metrics-es
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    deploy:
      resources:
        limits:
          memory: 1.5G
    ports:
      - "9200:9200"
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge
